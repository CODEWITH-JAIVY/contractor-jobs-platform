services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: contractor_app
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    expose: ["8080"]
    environment:
      APP_ENV: prod
      DB_URL: jdbc:mysql://mysql:3306/contractor_app?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      OTP_DEV_MODE: "false"
      SMS_PROVIDER: msg91
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID}
      ADMIN_PHONES: ${ADMIN_PHONES}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      FORWARD_HEADERS: framework
      FCM_ENABLED: "true"
      FCM_CREDENTIALS: /secrets/firebase-service-account.json
    volumes:
      - ./firebase-service-account.json:/secrets/firebase-service-account.json:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mysql_data:
  caddy_data:
  caddy_config: